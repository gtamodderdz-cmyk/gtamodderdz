<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTA MODDER DZ | مودات جزائرية لـ GTA V</title>
<meta name="description" content="الموقع الرسمي لقناة GTA MODDER DZ — مودات جزائرية للعبة GTA V: الشرطة، الدرك الوطني، الأزياء والمزيد.">
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@500;700;800&family=Cairo:wght@400;600;700&family=Russo+One&display=swap" rel="stylesheet">
<style>
/* VOICE: proud, loud gaming crew from Algeria — night city, sirens, flag colours.
   IDEA: a police dispatch / mod-garage terminal: livery stripes, badge plates, strobe light bar.
   PICTURE: the channel logo on a glowing badge plate under a strobing blue/red light bar, flag crescent behind.
   COLOUR and TYPE: night #0a0f0c, Algerian green #00a651 dominant, red #d21034 accent, white; Changa headings, Cairo body, Russo One for Latin tags.
   LAYOUT: sticky header, hero composition, 4 category plates, mod grid, news + videos, footer with flag band. */
:root{color-scheme:dark;--bg:#0a0f0c;--bg2:#101813;--panel:#131d17;--line:#22322a;--ink:#f2f5f1;--mute:#9db0a4;--g:#00a651;--g2:#006233;--r:#d21034;--b:#2f7bff;--sand:#c49a5a}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Cairo,Tahoma,sans-serif;overflow-x:clip}
a{color:inherit}
h1,h2,h3{font-family:Changa,Cairo,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(34px,5.4vw,58px);font-weight:800}
h2{font-size:clamp(26px,3.2vw,36px);font-weight:800}
h3{font-size:19px;font-weight:700}
.lat{font-family:"Russo One",Changa,sans-serif;letter-spacing:.02em}
.wrap{max-width:1240px;margin:0 auto}
.band{padding:clamp(28px,4vw,64px) max(5vw,16px)}
button,input,select,textarea{font:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 20px;border-radius:10px;border:1px solid var(--line);background:var(--panel);text-decoration:none;font-weight:700;white-space:nowrap}
.btn:hover{border-color:var(--g)}
.btn.pri{background:var(--g);border-color:var(--g);color:#04140b}
.btn.red{background:var(--r);border-color:var(--r);color:#fff}
.btn.disc{background:#5865f2;border-color:#5865f2;color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn svg{width:20px;height:20px;flex:none}
/* header */
header{position:sticky;top:0;z-index:20;background:rgba(10,15,12,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.flag{height:4px;background:linear-gradient(90deg,var(--g) 0 50%,#fff 50% 100%)}
.hd{display:flex;align-items:center;gap:16px;padding:10px max(5vw,16px);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-inline-end:auto}
.brand img{width:44px;height:44px;border-radius:10px;border:2px solid var(--g)}
.brand b{font-family:"Russo One";font-size:19px;line-height:1}
.brand b span{color:var(--g)}
.mini{width:30px;height:20px;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.25);flex:none}
.wave{position:absolute;inset:auto auto -2% -4%;width:46%;aspect-ratio:3/2;border-radius:8px;overflow:hidden;transform:rotate(-7deg);z-index:2;box-shadow:0 20px 50px rgba(0,0,0,.5);opacity:.9}
.wave svg{width:100%;height:100%;display:block}
.wave::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(0,0,0,.25),transparent 30%,rgba(255,255,255,.18) 45%,transparent 60%,rgba(0,0,0,.2))}
.badge img{z-index:1}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:10px 14px;border-radius:8px;text-decoration:none;font-weight:700;color:var(--mute)}
nav a.on,nav a:hover{color:var(--ink);background:var(--panel)}
nav a.on{box-shadow:inset 0 -3px 0 var(--g)}
.hdx{display:flex;gap:8px}
/* hero */
.hero{position:relative;overflow:hidden;background:radial-gradient(800px 420px at 20% 40%,rgba(0,166,81,.22),transparent 70%),radial-gradient(500px 300px at 85% 0,rgba(210,16,52,.16),transparent 70%),var(--bg)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:40px;align-items:center}
.hero p.lead{font-size:18px;color:#cfdad3;max-width:56ch;margin:18px 0 26px}
.hero h1 em{font-style:normal;color:var(--g)}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.stats{display:flex;gap:28px;margin-top:30px;flex-wrap:wrap}
.stats div b{display:block;font-family:"Russo One";font-size:30px;line-height:1}
.stats div span{color:var(--mute);font-size:14px}
.badge{position:relative;aspect-ratio:1;max-width:460px;width:100%;margin-inline:auto}
.badge svg.bg{position:absolute;inset:0;width:100%;height:100%}
.badge img{position:absolute;inset:18%;width:64%;height:64%;border-radius:22px;border:3px solid #fff;box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 8px rgba(0,166,81,.35)}
.strobe{animation:st 1.2s steps(1) infinite}.strobe.b2{animation-delay:.6s}
@keyframes st{0%{opacity:1}50%{opacity:.15}}
@media(prefers-reduced-motion:reduce){.strobe{animation:none}}
/* sections */
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.sec-h p{margin:6px 0 0;color:var(--mute)}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.cat{position:relative;display:flex;flex-direction:column;gap:6px;padding:20px;border-radius:14px;text-decoration:none;background:var(--panel);border:1px solid var(--line);overflow:hidden;min-height:150px}
.cat:hover{border-color:var(--c)}
.cat::before{content:"";position:absolute;inset:0 0 auto;height:8px;background:repeating-linear-gradient(90deg,var(--c) 0 22px,#fff 22px 44px)}
.cat svg{width:44px;height:44px;color:var(--c);margin-top:6px}
.cat b{font-family:"Russo One";font-size:17px}
.cat span{color:var(--mute);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;transition:transform .15s}
.card:hover{transform:translateY(-3px);border-color:var(--g)}
.cover{position:relative;aspect-ratio:16/9;background:#0d1511;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{position:absolute;inset:0;display:grid;place-items:center;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 30%,#0d1511) 0 18px,#0d1511 18px 36px)}
.cover .ph svg{width:56px;height:56px;color:#fff;opacity:.85}
.chip{display:inline-block;font-family:"Russo One";font-size:12px;padding:3px 9px;border-radius:6px;background:var(--c);color:#fff;white-space:nowrap}
.cover .chip{position:absolute;top:10px;inset-inline-start:10px}
.cbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.meta{display:flex;gap:14px;color:var(--mute);font-size:14px;flex-wrap:wrap;margin-top:auto}
.meta span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.meta svg{width:16px;height:16px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:28px}
.news{display:flex;flex-direction:column;gap:12px}
.ni{background:var(--panel);border:1px solid var(--line);border-inline-start:4px solid var(--r);border-radius:10px;padding:14px 16px}
.ni time{color:var(--mute);font-size:13px}
.ni p{margin:6px 0 0;color:#cfdad3;white-space:pre-wrap}
.vids{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.vid .cover .ph{background:linear-gradient(135deg,#1a0a0e,#3a0c18)}
.vid .play{position:absolute;inset:0;display:grid;place-items:center}
.vid .play i{width:58px;height:40px;border-radius:12px;background:#ff0033;display:grid;place-items:center}
.empty{padding:28px;border:1px dashed var(--line);border-radius:14px;color:var(--mute);text-align:center}
/* mods page */
.pagehd{background:linear-gradient(180deg,var(--bg2),var(--bg));border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-top:18px}
.tabs a{flex:none;padding:10px 16px;border-radius:10px;border:1px solid var(--line);text-decoration:none;font-family:"Russo One";font-size:14px;background:var(--panel)}
.tabs a.on{background:var(--c,var(--g));border-color:var(--c,var(--g));color:#fff}
.tools{display:flex;gap:10px;margin:18px 0 22px;flex-wrap:wrap}
.tools input,.tools select,.f input,.f select,.f textarea{min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg2)}
.tools input{flex:1 1 240px}
/* detail */
.det{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px;align-items:start}
.gal{position:relative}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:14px;background:#0d1511;scrollbar-width:none}
.slides>div{flex:0 0 100%;scroll-snap-align:start;aspect-ratio:16/9}
.slides img{width:100%;height:100%;object-fit:contain;display:block}
.gnav{position:absolute;top:50%;translate:0 -50%;width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:22px}
.gnav.p{inset-inline-start:10px}.gnav.n{inset-inline-end:10px}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto}
.thumbs button{flex:none;width:96px;aspect-ratio:16/9;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:#0d1511}
.thumbs button.on{border-color:var(--g)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.side{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.spec{width:100%;border-collapse:collapse}
.spec td{padding:9px 0;border-bottom:1px solid var(--line)}
.spec td:first-child{color:var(--mute);width:40%}
.ni.has{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:start;text-decoration:none}
.ni.has img{width:120px;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block}
a.ni{display:block;text-decoration:none}a.ni:hover{border-color:var(--g)}a.ni.has{display:grid}
.ni .more{color:var(--g);font-size:14px;font-weight:700}
.nbig{max-width:860px;margin:0 auto}
.nbig .desc{font-size:17px}
@media(max-width:600px){.ni.has{grid-template-columns:84px minmax(0,1fr)}.ni.has img{width:84px}}
.giscus-box{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.f .row2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:600px){.f .row2{grid-template-columns:minmax(0,1fr)}}
.lang{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.lang svg{width:18px;height:18px;color:var(--mute);flex:none}
.lang select{background:transparent;border:0;font-size:15px;font-weight:700;min-height:34px;cursor:pointer}
.lang option{background:var(--panel);color:var(--ink)}
.prog{height:10px;border-radius:6px;background:var(--bg2);border:1px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--g);transition:width .2s}
.filebox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.filebox b{flex:1;overflow-wrap:anywhere}
[dir=ltr] .gnav.p,[dir=ltr] .gnav.n{transform:scaleX(-1)}
.desc{white-space:pre-wrap;color:#d7e1da;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:20px}
.like.on{background:var(--r);border-color:var(--r);color:#fff}
.cm{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.cmi{display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--g2);font-weight:700}
.cmi p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.cmi small{color:var(--mute)}
.cmf{display:flex;gap:10px;margin-top:16px;align-items:flex-start}
.cmf textarea{flex:1;min-height:52px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);resize:vertical}
.x{background:none;border:0;color:var(--mute);min-height:32px;font-size:13px;text-decoration:underline}
/* about */
.about{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:36px;align-items:center}
.about p{font-size:18px;color:#d7e1da}
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:26px}
.contact>div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.contact code{font-size:17px;direction:ltr;text-align:start;overflow-wrap:anywhere}
.tags{display:flex;gap:8px;flex-wrap:wrap}
/* admin */
.f{display:grid;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.f label{display:grid;gap:6px;font-weight:600}
.f .row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.f textarea{min-height:120px;resize:vertical}
.pv{display:flex;gap:8px;flex-wrap:wrap}
.pv div{position:relative;width:120px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#0d1511}
.pv img{width:100%;height:100%;object-fit:cover}
.pv button{position:absolute;top:4px;inset-inline-end:4px;width:28px;height:28px;border-radius:50%;border:0;background:var(--r);color:#fff}
.alist{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.alist>div{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.alist>div b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{padding:12px 16px;border-radius:10px;background:rgba(0,166,81,.1);border:1px solid rgba(0,166,81,.35);color:#cfeedd;font-size:15px}
.note.warn{background:rgba(210,16,52,.1);border-color:rgba(210,16,52,.4);color:#ffd5dd}
/* modal + toast */
.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(0,0,0,.7);padding:16px}
.modal.on{display:grid}
.modal>div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:420px;width:100%}
.modal .cta{margin-top:18px;justify-content:flex-end}
#toast{position:fixed;bottom:20px;left:50%;translate:-50% 0;z-index:60;background:var(--g);color:#04140b;font-weight:700;padding:12px 20px;border-radius:10px;display:none}
footer{border-top:1px solid var(--line);background:var(--bg2)}
footer .wrap{display:flex;gap:24px;justify-content:space-between;flex-wrap:wrap;align-items:center}
footer small{color:var(--mute)}
.fb{height:10px;background:linear-gradient(90deg,var(--g) 0 50%,#fff 50%);position:relative}
.fb::after{content:"";position:absolute;left:50%;top:0;width:10px;height:10px;translate:-50% 0;background:var(--r);border-radius:50%}
.bc{color:var(--mute);font-size:14px;margin-bottom:10px}.bc a{color:var(--g)}
[hidden]{display:none!important}
@media(max-width:900px){.hero .wrap,.two,.det,.about{grid-template-columns:minmax(0,1fr)}.cats{grid-template-columns:repeat(2,minmax(0,1fr))}.badge{max-width:340px}}
@media(max-width:600px){.hero .wrap{gap:24px}.badge{order:-1;max-width:260px}.vids{grid-template-columns:minmax(0,1fr)}.f .row{grid-template-columns:minmax(0,1fr)}.hdx .btn span{display:none}nav{width:100%;overflow-x:auto;flex-wrap:nowrap}nav a{flex:none}}
</style>
</head>

<header>
 <div class="flag"></div>
 <div class="hd">
  <a class="brand" href="#home"><img src="logo.jpg" alt="شعار GTA MODDER DZ"><b class="lat">GTA MODDER <span>DZ</span></b><svg class="mini" viewBox="0 0 900 600" aria-label="علم الجزائر"><use href="#flag"/></svg></a>

<script>
{
const CFG=window.SITE||{};
const LOGO="logo.jpg";
const DISCORD="https://discord.gg/S57qpBeePT", YT="https://www.youtube.com/@GTAMODDERDZ", MAIL="gtamodderdz@gmail.com";
const MAXF=95*1024*1024;
const CATS=[
 {k:"police",n:"POLICE MODS",c:"#2f7bff",i:"i-police"},
 {k:"gendarmerie",n:"GENDARMERIE MODS",c:"#2e8b47",i:"i-gend"},
 {k:"uniforms",n:"UNIFORMS",c:"#c49a5a",i:"i-uni"},
 {k:"other",n:"OTHER MODS",c:"#d21034",i:"i-other"}];
const catOf=k=>CATS.find(c=>c.k===k)||CATS[3];
const D={mods:[],news:[],videos:[]};
const S={loaded:false,err:false,edit:null,draftImgs:[],draftFile:null,editNews:null,newsImgs:[],uploading:false,prev:{},sha:null,busy:false};
const $=s=>document.querySelector(s), app=$("#app");
/* ===== download counter (Abacus — free counting API) ===== */
const ABA="https://abacus.jasoncameron.dev",NS="gtamodderdz-cmyk-site";
const DL={};
const dlKey=id=>"dl-"+String(id).replace(/[^\w-]/g,"").slice(0,60);
const dlTxt=id=>id in DL?String(DL[id]):"…";
const dlTotal=()=>Object.values(DL).reduce((a,b)=>a+(+b||0),0);
function refreshCounts(){document.querySelectorAll("[data-dl]").forEach(el=>el.textContent=dlTxt(el.dataset.dl));document.querySelectorAll("[data-dltotal]").forEach(el=>el.textContent=dlTotal())}
async function loadCounts(){
 const ids=D.mods.map(m=>m.id).filter(id=>!(id in DL));
 for(let i=0;i<ids.length;i+=6)await Promise.all(ids.slice(i,i+6).map(async id=>{try{const r=await fetch(`${ABA}/get/${NS}/${dlKey(id)}`);DL[id]=r.ok?(+(await r.json()).value||0):0}catch{DL[id]=0}}));
 refreshCounts();if(($("#sort")||{}).value==="dl")fillList(curCat())}
function hitDl(id){let k="gmdz_dl_"+id,seen=false;try{seen=!!localStorage.getItem(k);localStorage.setItem(k,"1")}catch{}
 if(seen)return;fetch(`${ABA}/hit/${NS}/${dlKey(id)}`,{keepalive:true}).then(r=>r.json()).then(j=>{DL[id]=+j.value||((DL[id]||0)+1);refreshCounts()}).catch(()=>{})}
const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch{}}};

/* ===== i18n ===== */
const L=window.I18N;
let lang=(()=>{const s=store.get("gmdz_lang");if(L[s])return s;const n=(navigator.language||"ar").slice(0,2);return L[n]?n:"ar"})();
const T=(k,v)=>{let s=(L[lang]&&L[lang][k])??L.ar[k]??k;if(v)for(const[a,b]of Object.entries(v))s=s.replace("{"+a+"}",b);return s};
function applyLang(){const d=L[lang];document.documentElement.lang=lang;document.documentElement.dir=d.dir;$("#langSel").value=lang;
 document.querySelectorAll("[data-i]").forEach(el=>el.textContent=T(el.dataset.i))}

const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https:\/\//i.test(String(u||""))?String(u):"";
const okImg=p=>/^images\/[\w-]+\.(jpg|jpeg|png|webp)$/i.test(String(p||""));
const okFile=p=>/^files\/[\w.-]+$/.test(String(p||""))&&!/\.\./.test(p);
const imgSrc=p=>okImg(p)?(S.prev[p]||p):"";
const fmtD=t=>t?new Date(t).toLocaleDateString(L[lang].loc,{year:"numeric",month:"long",day:"numeric"}):"";
const fmtSize=b=>b>=1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const sorted=a=>[...a].sort((x,y)=>(y.t||0)-(x.t||0));
function toast(m,bad,stay){const t=$("#toast");t.textContent=m;t.style.background=bad?"var(--r)":"var(--g)";t.style.color=bad?"#fff":"#04140b";t.style.display="block";clearTimeout(toast.h);if(!stay)toast.h=setTimeout(()=>t.style.display="none",3400)}
function ask(title,body){return new Promise(res=>{$("#mT").textContent=title;$("#mB").textContent=body;const m=$("#modal");m.classList.add("on");const done=v=>{m.classList.remove("on");$("#mYes").onclick=$("#mNo").onclick=null;res(v)};$("#mYes").onclick=()=>done(true);$("#mNo").onclick=()=>done(false)})}

/* ===== GitHub API (admin only) ===== */
function guessRepo(){const h=location.hostname,m=h.match(/^([\w-]+)\.github\.io$/i);if(!m)return{owner:"",repo:""};const seg=location.pathname.split("/").filter(Boolean)[0];return{owner:m[1],repo:seg&&!/\.html$/.test(seg)?seg:h}}
const A=(()=>{const g=guessRepo();let s={};try{s=JSON.parse(store.get("gmdz_admin")||"{}")}catch{}return{owner:s.owner||g.owner,repo:s.repo||g.repo,branch:s.branch||"main",token:s.token||""}})();
const isAdmin=()=>!!(A.token&&A.ok);
const API=()=>`https://api.github.com/repos/${encodeURIComponent(A.owner)}/${encodeURIComponent(A.repo)}`;
const HDR=()=>({Authorization:"Bearer "+A.token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"});
const b64=s=>{const by=new TextEncoder().encode(s);let bin="";for(let i=0;i<by.length;i+=8192)bin+=String.fromCharCode(...by.subarray(i,i+8192));return btoa(bin)};
const unb64=s=>new TextDecoder().decode(Uint8Array.from(atob(String(s).replace(/\s/g,"")),c=>c.charCodeAt(0)));
async function gh(path,opt={}){
 const r=await fetch(API()+path,{...opt,cache:"no-store",headers:{...HDR(),...(opt.body?{"Content-Type":"application/json"}:{})}});
 if(!r.ok){const e=new Error("GitHub "+r.status);e.status=r.status;throw e}
 return r.status===204?null:r.json()}
function ghXhr(path,body,onProg){return new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open("POST",API()+path);
 for(const[k,v]of Object.entries(HDR()))x.setRequestHeader(k,v);x.setRequestHeader("Content-Type","application/json");
 x.upload.onprogress=e=>{if(e.lengthComputable&&onProg)onProg(e.loaded/e.total)};
 x.onload=()=>{if(x.status>=200&&x.status<300){try{res(JSON.parse(x.responseText))}catch{rej(new Error("parse"))}}else{const e=new Error("GitHub "+x.status);e.status=x.status;rej(e)}};
 x.onerror=()=>rej(new Error("network"));x.send(body)})}
async function adminLogin(){
 const rp=await gh("");if(!rp.permissions||!rp.permissions.push){const e=new Error(T("t_no_push"));e.status=403;throw e}
 A.ok=true;await loadFromApi()}
async function loadFromApi(){
 try{const f=await gh(`/contents/data.json?ref=${encodeURIComponent(A.branch)}`);S.sha=f.sha;setData(JSON.parse(unb64(f.content)))}
 catch(e){if(e.status===404){S.sha=null;setData({})}else throw e}}
async function saveData(msg){
 const body={message:msg,content:b64(JSON.stringify(D,null,1)),branch:A.branch};if(S.sha)body.sha=S.sha;
 try{const r=await gh("/contents/data.json",{method:"PUT",body:JSON.stringify(body)});S.sha=r.content.sha}
 catch(e){if(e.status===409||e.status===422){await loadFromApi();throw new Error(T("t_conflict"))}throw e}}
async function delFile(p){try{const f=await gh(`/contents/${p}?ref=${encodeURIComponent(A.branch)}`);await gh(`/contents/${p}`,{method:"DELETE",body:JSON.stringify({message:"delete "+p,sha:f.sha,branch:A.branch})})}catch{}}
async function toJpeg(file){const bm=await createImageBitmap(file),r=Math.min(1,1600/Math.max(bm.width,bm.height)),c=document.createElement("canvas");c.width=Math.round(bm.width*r);c.height=Math.round(bm.height*r);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.85)}
async function uploadImg(file){
 try{toast(T("t_img_up"),0,1);const d=await toJpeg(file),p="images/"+uid()+".jpg";
  await gh("/contents/"+p,{method:"PUT",body:JSON.stringify({message:"image "+p,content:d.split(",")[1],branch:A.branch})});
  S.prev[p]=d;toast(T("t_img_ok"));return p}catch(e){toast(T("t_img_err")+" ("+(e.status||e.message)+")",1);return""}}
const readB64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]||"");r.onerror=()=>rej(r.error);r.readAsDataURL(f)});
/* big files: Git Data API (blob → tree → commit → ref) with upload progress */
async function uploadModFile(file){
 if(file.size>MAXF){toast(T("t_file_big"),1);return null}
 S.uploading=true;const bar=$("#fprog i"),box=$("#fprog");if(box)box.hidden=false;
 const prog=p=>{const pc=Math.round(p*100);if(bar)bar.style.width=pc+"%";toast(T("t_file_up",{p:pc}),0,1)};
 try{prog(0);
  const safe=file.name.normalize("NFKD").replace(/[^\w.-]+/g,"_").replace(/_+/g,"_").slice(-80)||"mod.zip";
  const path="files/"+uid()+"-"+safe;
  const content=await readB64(file);
  const blob=await ghXhr("/git/blobs",JSON.stringify({content,encoding:"base64"}),p=>prog(p*.95));
  const ref=await gh(`/git/ref/heads/${encodeURIComponent(A.branch)}`);
  const cm=await gh(`/git/commits/${ref.object.sha}`);
  const tree=await gh("/git/trees",{method:"POST",body:JSON.stringify({base_tree:cm.tree.sha,tree:[{path,mode:"100644",type:"blob",sha:blob.sha}]})});
  const nc=await gh("/git/commits",{method:"POST",body:JSON.stringify({message:"mod file "+path,tree:tree.sha,parents:[ref.object.sha]})});
  await gh(`/git/refs/heads/${encodeURIComponent(A.branch)}`,{method:"PATCH",body:JSON.stringify({sha:nc.sha})});
  prog(1);toast(T("t_file_ok"));return{path,name:file.name.slice(0,120),size:file.size}}
 catch(e){toast(T("t_file_err")+" ("+(e.status||e.message)+")",1);return null}
 finally{S.uploading=false;if(box)box.hidden=true}}

   catch(err){A.token="";toast(err.status===401?T("t_bad_token"):err.status===404?T("t_no_repo"):err.message,1)}}
  if(f.id==="fMod"){
   if(S.uploading)throw new Error(T("t_wait_up"));
   const link=$("#mLink").value.trim();if(link&&!safeUrl(link))throw new Error(T("t_https"));
   if(!link&&!S.draftFile)throw new Error(T("t_need_dl"));
   const id=S.edit?.id||("m"+uid()),isEdit=!!S.edit?.id,oldFile=S.edit?.file;
   const mod={id,title:$("#mTitle").value.trim(),cat:$("#mCat").value,creator:$("#mCreator").value.trim(),size:$("#mSize").value.trim(),version:$("#mVer").value.trim(),link,file:S.draftFile||null,desc:$("#mDesc").value,imgs:[...S.draftImgs],t:S.edit?.t||Date.now()};
   if(await commit(()=>{D.mods=isEdit?D.mods.map(x=>x.id===id?mod:x):[...D.mods,mod]},(isEdit?"edit mod: ":"new mod: ")+mod.title)){
    if(oldFile&&okFile(oldFile.path)&&(!mod.file||mod.file.path!==oldFile.path))delFile(oldFile.path);
    S.edit=null;S.draftImgs=[];S.draftFile=null;location.hash="#mod-"+id}}
  if(f.id==="fNews"){const ed=S.editNews,n={id:ed?.id||("n"+uid()),title:$("#nTitle").value.trim(),body:$("#nBody").value,imgs:[...S.newsImgs],t:ed?.t||Date.now()};
   const removed=(ed?.imgs||[]).filter(p=>!n.imgs.includes(p));
   if(await commit(()=>{D.news=ed?D.news.map(x=>x.id===n.id?n:x):[...D.news,n]},(ed?"edit news: ":"news: ")+n.title)){for(const p of removed)if(okImg(p))delFile(p);S.editNews=null;S.newsImgs=[];location.hash="#news-"+n.id}}
  if(f.id==="fVid"){const url=$("#vUrl").value.trim();if(!safeUrl(url))throw new Error(T("t_https"));
   const file=$("#vThumb").files[0],thumb=file?await uploadImg(file):"";const v={id:"v"+uid(),title:$("#vTitle").value.trim(),url,thumb,t:Date.now()};await commit(()=>{D.videos=[...D.videos,v]},"video: "+v.title)}
 }catch(err){toast(err.message||T("t_err"),1)}
 const nb=app.querySelector("form#"+f.id+" button.pri");if(nb)nb.disabled=false;
});
addEventListener("beforeunload",e=>{if(S.uploading){e.preventDefault();e.returnValue=""}});

/* ===== boot ===== */
applyLang();render();
(async()=>{
 if(A.token){try{await adminLogin()}catch{A.ok=false;await loadPublic()}}else await loadPublic();
 render();loadCounts();
})();
}
</script>
</body>
</html>
