<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<meta property="og:title" content="GTA MODS ALGERIA — مودات جزائرية لـ GTA V">
<meta property="og:description" content="مودات الشرطة، الدرك الوطني، السيارات المدنية والأزياء الجزائرية للعبة GTA V — من قناتي GTA MODDER DZ و ADEM MNG.">
<meta property="og:image" content="https://gtamodsalgeria.github.io/site-logo.jpg">
<meta property="og:url" content="https://gtamodsalgeria.github.io/">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* VOICE: proud, loud gaming crew from Algeria — night city, sirens, flag colours.
   IDEA: a police dispatch / mod-garage terminal: livery stripes, badge plates, strobe light bar.
   PICTURE: the channel logo on a glowing badge plate under a strobing blue/red light bar, flag crescent behind.
   COLOUR and TYPE: night #0a0f0c, Algerian green #00a651 dominant, red #d21034 accent, white; Changa headings, Cairo body, Russo One for Latin tags.
   LAYOUT: sticky header, hero composition, 4 category plates, mod grid, news + videos, footer with flag band. */
:root{color-scheme:dark;--bg:#0a0f0c;--bg2:#101813;--panel:#131d17;--line:#22322a;--ink:#f2f5f1;--mute:#9db0a4;--g:#00a651;--g2:#006233;--r:#d21034;--b:#2f7bff;--sand:#c49a5a}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Cairo,Tahoma,sans-serif;overflow-x:clip}
a{color:inherit}
h1,h2,h3{font-family:Changa,Cairo,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(34px,5.4vw,58px);font-weight:800}
h2{font-size:clamp(26px,3.2vw,36px);font-weight:800}
h3{font-size:19px;font-weight:700}
.lat{font-family:"Russo One",Changa,sans-serif;letter-spacing:.02em}
.wrap{max-width:1240px;margin:0 auto}
.band{padding:clamp(28px,4vw,64px) max(5vw,16px)}
button,input,select,textarea{font:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 20px;border-radius:10px;border:1px solid var(--line);background:var(--panel);text-decoration:none;font-weight:700;white-space:nowrap}
.btn:hover{border-color:var(--g)}
.btn.pri{background:var(--g);border-color:var(--g);color:#04140b}
.btn.red{background:var(--r);border-color:var(--r);color:#fff}
.btn.disc{background:#5865f2;border-color:#5865f2;color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn svg{width:20px;height:20px;flex:none}
/* header */
header{position:sticky;top:0;z-index:20;background:rgba(10,15,12,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.flag{height:4px;background:linear-gradient(90deg,var(--g) 0 50%,#fff 50% 100%)}
.hd{display:flex;align-items:center;gap:16px;padding:10px max(5vw,16px);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-inline-end:auto}
.brand img{width:46px;height:46px;border-radius:50%;border:2px solid var(--g);box-shadow:0 0 14px rgba(0,166,81,.45)}
.brand b{font-family:"Russo One";font-size:19px;line-height:1}
.brand b span{color:var(--g)}
.mini{width:30px;height:20px;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.25);flex:none}
.wave{position:absolute;inset:auto auto -2% -4%;width:46%;aspect-ratio:3/2;border-radius:8px;overflow:hidden;transform:rotate(-7deg);z-index:2;box-shadow:0 20px 50px rgba(0,0,0,.5);opacity:.9}
.wave svg{width:100%;height:100%;display:block}
.wave::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(0,0,0,.25),transparent 30%,rgba(255,255,255,.18) 45%,transparent 60%,rgba(0,0,0,.2))}
.badge img{z-index:1}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:10px 14px;border-radius:8px;text-decoration:none;font-weight:700;color:var(--mute)}
nav a.on,nav a:hover{color:var(--ink);background:var(--panel)}
nav a.on{box-shadow:inset 0 -3px 0 var(--g)}
.hdx{display:flex;gap:8px}
/* hero */
.hero{position:relative;overflow:hidden;background:radial-gradient(800px 420px at 20% 40%,rgba(0,166,81,.22),transparent 70%),radial-gradient(500px 300px at 85% 0,rgba(210,16,52,.16),transparent 70%)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:40px;align-items:center}
.hero p.lead{font-size:18px;color:#cfdad3;max-width:56ch;margin:18px 0 26px}
.hero h1 em{font-style:normal;color:var(--g)}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.stats{display:flex;gap:28px;margin-top:30px;flex-wrap:wrap}
.stats div b{display:block;font-family:"Russo One";font-size:30px;line-height:1}
.stats div span{color:var(--mute);font-size:14px}
.badge{position:relative;aspect-ratio:1;max-width:460px;width:100%;margin-inline:auto}
.badge svg.bg{position:absolute;inset:0;width:100%;height:100%}
.badge img{position:absolute;inset:14%;width:72%;height:72%;border-radius:50%;box-shadow:0 24px 60px rgba(0,0,0,.65),0 0 0 6px rgba(0,166,81,.35),0 0 70px rgba(210,16,52,.3)}
.strobe{animation:st 1.2s steps(1) infinite}.strobe.b2{animation-delay:.6s}
@keyframes st{0%{opacity:1}50%{opacity:.15}}
@media(prefers-reduced-motion:reduce){.strobe{animation:none}}
/* sections */
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.sec-h p{margin:6px 0 0;color:var(--mute)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.cat{position:relative;display:flex;flex-direction:column;gap:6px;padding:20px;border-radius:14px;text-decoration:none;background:var(--panel);border:1px solid var(--line);overflow:hidden;min-height:150px}
.cat:hover{border-color:var(--c)}
.cat::before{content:"";position:absolute;inset:0 0 auto;height:8px;background:repeating-linear-gradient(90deg,var(--c) 0 22px,#fff 22px 44px)}
.cat svg{width:44px;height:44px;color:var(--c);margin-top:6px}
.cat b{font-family:"Russo One";font-size:17px}
.cat span{color:var(--mute);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;transition:transform .15s}
.card:hover{transform:translateY(-3px);border-color:var(--g)}
.cover{position:relative;aspect-ratio:16/9;background:#0d1511;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{position:absolute;inset:0;display:grid;place-items:center;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 30%,#0d1511) 0 18px,#0d1511 18px 36px)}
.cover .ph svg{width:56px;height:56px;color:#fff;opacity:.85}
.chip{display:inline-block;font-family:"Russo One";font-size:12px;padding:3px 9px;border-radius:6px;background:var(--c);color:#fff;white-space:nowrap}
.cover .chip{position:absolute;top:10px;inset-inline-start:10px}
.cbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.meta{display:flex;gap:14px;color:var(--mute);font-size:14px;flex-wrap:wrap;margin-top:auto}
.meta span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.meta svg{width:16px;height:16px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:28px}
.news{display:flex;flex-direction:column;gap:12px}
.ni{background:var(--panel);border:1px solid var(--line);border-inline-start:4px solid var(--r);border-radius:10px;padding:14px 16px}
.ni time{color:var(--mute);font-size:13px}
.ni p{margin:6px 0 0;color:#cfdad3;white-space:pre-wrap}
.vids{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.vid .cover .ph{background:linear-gradient(135deg,#1a0a0e,#3a0c18)}
.vid .play{position:absolute;inset:0;display:grid;place-items:center}
.vid .play i{width:58px;height:40px;border-radius:12px;background:#ff0033;display:grid;place-items:center}
.empty{padding:28px;border:1px dashed var(--line);border-radius:14px;color:var(--mute);text-align:center}
/* mods page */
.pagehd{background:linear-gradient(180deg,rgba(16,24,19,.85),rgba(10,15,12,.35));border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-top:18px}
.tabs a{flex:none;padding:10px 16px;border-radius:10px;border:1px solid var(--line);text-decoration:none;font-family:"Russo One";font-size:14px;background:var(--panel)}
.tabs a.on{background:var(--c,var(--g));border-color:var(--c,var(--g));color:#fff}
.tools{display:flex;gap:10px;margin:18px 0 22px;flex-wrap:wrap}
.tools input,.tools select,.f input,.f select,.f textarea{min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg2)}
.tools input{flex:1 1 240px}
/* detail */
.det{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px;align-items:start}
.gal{position:relative}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:14px;background:#0d1511;scrollbar-width:none}
.slides>div{flex:0 0 100%;scroll-snap-align:start;aspect-ratio:16/9}
.slides img{width:100%;height:100%;object-fit:contain;display:block}
.gnav{position:absolute;top:50%;translate:0 -50%;width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:22px}
.gnav.p{inset-inline-start:10px}.gnav.n{inset-inline-end:10px}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto}
.thumbs button{flex:none;width:96px;aspect-ratio:16/9;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:#0d1511}
.thumbs button.on{border-color:var(--g)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.side{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.spec{width:100%;border-collapse:collapse}
.spec td{padding:9px 0;border-bottom:1px solid var(--line)}
.spec td:first-child{color:var(--mute);width:40%}
.ni.has{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:start;text-decoration:none}
.ni.has img{width:120px;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block}
a.ni{display:block;text-decoration:none}a.ni:hover{border-color:var(--g)}a.ni.has{display:grid}
.ni .more{color:var(--g);font-size:14px;font-weight:700}
.nbig{max-width:860px;margin:0 auto}
.nbig .desc{font-size:17px}
@media(max-width:600px){.ni.has{grid-template-columns:84px minmax(0,1fr)}.ni.has img{width:84px}}
#bgs{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg);pointer-events:none}
#bgs i{position:absolute;inset:-3%;background-size:cover;background-position:center;opacity:0;transition:opacity 2.2s ease,transform 9s linear;transform:scale(1)}
#bgs i.on{opacity:.55;transform:scale(1.04)}
#bgs::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(10,15,12,.2),rgba(10,15,12,.6) 80%),linear-gradient(180deg,rgba(10,15,12,.3),rgba(10,15,12,.7))}
@media(prefers-reduced-motion:reduce){#bgs i{transition:none;transform:none}#bgs i.on{transform:none}}
.pub{position:absolute;bottom:10px;inset-inline-end:10px;display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 4px;border-radius:20px;background:rgba(0,0,0,.65);font-size:12px;font-weight:700;color:#fff}
.av2{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;overflow:hidden;background:var(--r);color:#fff;font:700 10px/1 "Russo One",sans-serif;flex:none;position:relative}
.av2 img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av2.lg{width:72px;height:72px;font-size:24px;border:3px solid var(--g)}
.chs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;margin-top:22px}
.ch{display:flex;gap:16px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.ch h3{margin-bottom:4px}.ch p{margin:0 0 12px;color:#cfdad3;font-size:15px}
.thx .av2.lg{border-color:var(--sand)}
.thx-strip{display:flex;gap:12px;flex-wrap:wrap}
.thx-strip a{display:inline-flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:30px;background:var(--panel);border:1px solid var(--line);text-decoration:none;font-weight:700}
.thx-strip a:hover{border-color:var(--sand)}
.thx-strip .av2{width:36px;height:36px;font-size:13px}
.newb{position:absolute;top:10px;inset-inline-end:10px;font:700 11px/1 "Russo One",sans-serif;padding:5px 8px;border-radius:6px;background:#ffd400;color:#111;letter-spacing:.04em}
.share{display:flex;gap:8px;flex-wrap:wrap}
.share .btn{flex:1;justify-content:center}
.btn.wa{background:#25d366;border-color:#25d366;color:#05210f}
#vmodal{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:rgba(0,0,0,.85);padding:16px}
#vmodal.on{display:grid}
#vmodal>div{width:min(1100px,100%);aspect-ratio:16/9;position:relative;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 30px 80px rgba(0,0,0,.6)}
#vmodal iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#vmodal button{position:absolute;z-index:2;top:8px;inset-inline-end:8px;width:44px;height:44px;border-radius:50%;border:0;background:var(--r);color:#fff;font-size:24px;box-shadow:0 4px 14px rgba(0,0,0,.5)}
/* --- motion --- */
.btn{transition:transform .15s ease,background-color .2s,border-color .2s,box-shadow .2s}
.btn:hover{box-shadow:0 6px 18px rgba(0,0,0,.35)}
.btn:active{transform:scale(.95)}
.btn.pri:hover{box-shadow:0 6px 22px rgba(0,166,81,.45)}
.snd{padding:0 10px}.snd svg{width:20px;height:20px}
header{transition:box-shadow .3s,background .3s}
header.scrolled{box-shadow:0 10px 30px rgba(0,0,0,.5);background:rgba(8,12,10,.94)}
nav a{transition:color .2s,background .2s}
.rv{opacity:0;transform:translateY(22px);transition:opacity .6s ease,transform .7s cubic-bezier(.2,.75,.2,1)!important}
.rv.in{opacity:1;transform:none}
#app.enter{animation:pageIn .45s cubic-bezier(.2,.75,.2,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}}
.hero h1,.hero .lead,.hero .cta,.hero .stats,.hero .chip{animation:up .8s cubic-bezier(.2,.75,.2,1) both}
.hero .lead{animation-delay:.1s}.hero .cta{animation-delay:.2s}.hero .stats{animation-delay:.3s}
@keyframes up{from{opacity:0;transform:translateY(26px)}}
.badge{animation:zoomIn 1s cubic-bezier(.2,.75,.2,1) both}
@keyframes zoomIn{from{opacity:0;transform:scale(.85) rotate(-4deg)}}
.badge img{animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.wave{animation:wave 5s ease-in-out infinite}
@keyframes wave{50%{transform:rotate(-4deg) translateY(-4px)}}
.card{position:relative;transition:transform .25s cubic-bezier(.2,.75,.2,1),border-color .2s,box-shadow .25s}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(0,0,0,.45)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.13) 46%,transparent 62%);transform:translateX(-130%);transition:transform .8s ease}
.card:hover::after{transform:translateX(130%)}
.cover img{transition:transform .6s cubic-bezier(.2,.75,.2,1)}
.card:hover .cover img{transform:scale(1.06)}
.cat{transition:transform .25s cubic-bezier(.2,.75,.2,1),border-color .2s,box-shadow .25s}
.cat:hover{transform:translateY(-5px);box-shadow:0 14px 34px rgba(0,0,0,.4)}
.cat:hover svg{animation:pop .5s ease}
@keyframes pop{40%{transform:scale(1.2) rotate(-6deg)}}
.cat::after{content:"";position:absolute;inset:auto 0 0;height:3px;background:var(--c);transform:scaleX(0);transform-origin:right;transition:transform .35s ease}
.cat:hover::after{transform:scaleX(1)}
.ni,.ch{transition:transform .25s ease,border-color .2s}
a.ni:hover,.ch:hover{transform:translateY(-3px)}
.chip{transition:transform .2s}.tags a.chip:hover{transform:translateY(-2px)}
#toast{animation:none}#toast.show{animation:toastIn .35s cubic-bezier(.2,.75,.2,1)}
@keyframes toastIn{from{opacity:0;transform:translate(0,16px)}}
#vmodal.on>div{animation:zoomIn .4s cubic-bezier(.2,.75,.2,1)}
.modal.on>div{animation:zoomIn .3s cubic-bezier(.2,.75,.2,1)}
.like-burst{position:fixed;pointer-events:none;z-index:80;width:8px;height:8px;border-radius:50%;animation:burst .7s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
.desc a{color:var(--g);overflow-wrap:anywhere}
.desc .yt{position:relative;display:block;aspect-ratio:16/9;width:100%;max-width:860px;margin:12px 0;border-radius:12px;overflow:hidden;background:#000;box-shadow:0 12px 30px rgba(0,0,0,.45);white-space:normal}
.desc .yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.hint{display:block;font-weight:400;font-size:13px;color:var(--mute)}
.giscus-box{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.f .row2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:600px){.f .row2{grid-template-columns:minmax(0,1fr)}}
.lang{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.lang svg{width:18px;height:18px;color:var(--mute);flex:none}
.lang select{background:transparent;border:0;font-size:15px;font-weight:700;min-height:34px;cursor:pointer}
.lang option{background:var(--panel);color:var(--ink)}
.prog{height:10px;border-radius:6px;background:var(--bg2);border:1px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--g);transition:width .2s}
.filebox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.filebox b{flex:1;overflow-wrap:anywhere}
[dir=ltr] .gnav.p,[dir=ltr] .gnav.n{transform:scaleX(-1)}
.desc{white-space:pre-wrap;color:#d7e1da;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:20px}
.like.on{background:var(--r);border-color:var(--r);color:#fff}
.cm{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.cmi{display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--g2);font-weight:700}
.cmi p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.cmi small{color:var(--mute)}
.cmf{display:flex;gap:10px;margin-top:16px;align-items:flex-start}
.cmf textarea{flex:1;min-height:52px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);resize:vertical}
.x{background:none;border:0;color:var(--mute);min-height:32px;font-size:13px;text-decoration:underline}
/* about */
.about{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:36px;align-items:center}
.about p{font-size:18px;color:#d7e1da}
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:26px}
.contact>div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.contact code{font-size:17px;direction:ltr;text-align:start;overflow-wrap:anywhere}
.tags{display:flex;gap:8px;flex-wrap:wrap}
/* admin */
.f{display:grid;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.f label{display:grid;gap:6px;font-weight:600}
.f .row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.f textarea{min-height:120px;resize:vertical}
.pv{display:flex;gap:8px;flex-wrap:wrap}
.pv div{position:relative;width:120px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#0d1511}
.pv img{width:100%;height:100%;object-fit:cover}
.pv button{position:absolute;top:4px;inset-inline-end:4px;width:28px;height:28px;border-radius:50%;border:0;background:var(--r);color:#fff}
.alist{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.alist>div{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.alist>div b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{padding:12px 16px;border-radius:10px;background:rgba(0,166,81,.1);border:1px solid rgba(0,166,81,.35);color:#cfeedd;font-size:15px}
.note.warn{background:rgba(210,16,52,.1);border-color:rgba(210,16,52,.4);color:#ffd5dd}
/* modal + toast */
.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(0,0,0,.7);padding:16px}
.modal.on{display:grid}
.modal>div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:420px;width:100%}
.modal .cta{margin-top:18px;justify-content:flex-end}
#toast{position:fixed;bottom:20px;left:50%;translate:-50% 0;z-index:60;background:var(--g);color:#04140b;font-weight:700;padding:12px 20px;border-radius:10px;display:none}
footer{border-top:1px solid var(--line);background:var(--bg2)}
footer .wrap{display:flex;gap:24px;justify-content:space-between;flex-wrap:wrap;align-items:center}
footer small{color:var(--mute)}
.fb{height:10px;background:linear-gradient(90deg,var(--g) 0 50%,#fff 50%);position:relative}
.fb::after{content:"";position:absolute;left:50%;top:0;width:10px;height:10px;translate:-50% 0;background:var(--r);border-radius:50%}
.bc{color:var(--mute);font-size:14px;margin-bottom:10px}.bc a{color:var(--g)}
[hidden]{display:none!important}
@media(max-width:900px){.hero .wrap,.two,.det,.about{grid-template-columns:minmax(0,1fr)}.cats{grid-template-columns:repeat(2,minmax(0,1fr))}.badge{max-width:340px}}
@media(max-width:600px){.hero .wrap{gap:24px}.badge{order:-1;max-width:260px}.vids{grid-template-columns:minmax(0,1fr)}.f .row{grid-template-columns:minmax(0,1fr)}.hdx .btn span{display:none}nav{width:100%;overflow-x:auto;flex-wrap:nowrap}nav a{flex:none}}
</style>

async function saveData(msg){
 const br=encodeURIComponent(A.branch),ref=await gh(`/git/ref/heads/${br}`),base=ref.object.sha;
 if(S.sha){try{const cur=await gh(`/contents/data.json?ref=${base}`);if(cur.sha!==S.sha){await loadFromApi();throw new Error(T("t_conflict"))}}catch(e){if(e.message===T("t_conflict"))throw e;if(e.status!==404)throw e}}
 const seo=buildSeo(),data=JSON.stringify(D,null,1);
 const entries=[{path:"data.json",mode:"100644",type:"blob",content:data},...Object.entries(seo).map(([path,content])=>({path,mode:"100644",type:"blob",content}))];
 for(const p of [...await listDir("mods",base),...await listDir("news",base)])if(/\.html$/.test(p)&&!(p in seo))entries.push({path:p,mode:"100644",type:"blob",sha:null});
 const cm=await gh(`/git/commits/${base}`);
 const tree=await gh("/git/trees",{method:"POST",body:JSON.stringify({base_tree:cm.tree.sha,tree:entries})});
 const nc=await gh("/git/commits",{method:"POST",body:JSON.stringify({message:msg,tree:tree.sha,parents:[base]})});
 try{await gh(`/git/refs/heads/${br}`,{method:"PATCH",body:JSON.stringify({sha:nc.sha,force:false})})}
 catch(e){if(e.status===422||e.status===409){await loadFromApi();throw new Error(T("t_conflict"))}throw e}

async function relId(){
 try{return (await gh(`/releases/tags/${REL_TAG}`)).id}
 catch(e){if(e.status!==404)throw e;
  return (await gh("/releases",{method:"POST",body:JSON.stringify({tag_name:REL_TAG,target_commitish:A.branch,name:"Mod files",body:"ملفات المودات — GTA MODS ALGERIA"})})).id}}
async function relXhr(id,name,file,onProg){try{return await relXhr1(id,name,file,onProg,"Bearer ")}catch(e){if(e.status===401)return relXhr1(id,name,file,onProg,"token ");throw e}}
function relXhr1(id,name,file,onProg,scheme){return new Promise((res,rej)=>{const x=new XMLHttpRequest();
 x.open("POST",`https://uploads.github.com/repos/${encodeURIComponent(A.owner)}/${encodeURIComponent(A.repo)}/releases/${id}/assets?name=${encodeURIComponent(name)}`);
 x.setRequestHeader("Authorization",scheme+A.token);x.setRequestHeader("Accept","application/vnd.github+json");x.setRequestHeader("Content-Type","application/octet-stream");
 x.upload.onprogress=e=>{if(e.lengthComputable)onProg(e.loaded/e.total)};
 x.onload=()=>{if(x.status>=200&&x.status<300){try{res(JSON.parse(x.responseText))}catch{rej(new Error("parse"))}}else{const e=new Error("GitHub "+x.status);e.status=x.status;rej(e)}};
 x.onerror=()=>{const e=new Error("network");e.net=true;rej(e)};x.send(file)})}

async function uploadModFile(file){
 if(file.size>MAXR){toast(T("t_file_big"),1);return null}
 S.uploading=true;const bar=$("#fprog i"),box=$("#fprog");if(box)box.hidden=false;
 const prog=p=>{const pc=Math.round(p*100);if(bar)bar.style.width=pc+"%";toast(T("t_file_up",{p:pc}),0,1)};
 const safe=file.name.normalize("NFKD").replace(/[^\w.-]+/g,"_").replace(/_+/g,"_").slice(-80)||"mod.zip";
 try{prog(0);const id=await relId();const a=await relXhr(id,uid()+"-"+safe,file,p=>prog(p*.99));
  if(!okRel(a.browser_download_url))throw new Error("url");
  prog(1);toast(T("t_file_ok"));S.uploading=false;if(box)box.hidden=true;return{url:a.browser_download_url,assetId:a.id,name:file.name.slice(0,120),size:file.size}}
 catch(e){console.warn("releases upload failed",e);
  if(file.size>MAXF){toast(T("t_rel_manual"),1);S.uploading=false;if(box)box.hidden=true;return null}
  toast(T("t_rel_fb"),0,1)}
 return uploadRepoFile(file,safe,prog,bar,box)}
async function uploadRepoFile(file,safe,prog,bar,box){
 S.uploading=true;if(box)box.hidden=false;
 try{prog(0);
  const path="files/"+uid()+"-"+safe;
  const content=await readB64(file);
  const blob=await ghXhr("/git/blobs",JSON.stringify({content,encoding:"base64"}),p=>prog(p*.95));
  const ref=await gh(`/git/ref/heads/${encodeURIComponent(A.branch)}`);
  const cm=await gh(`/git/commits/${ref.object.sha}`);
  const tree=await gh("/git/trees",{method:"POST",body:JSON.stringify({base_tree:cm.tree.sha,tree:[{path,mode:"100644",type:"blob",sha:blob.sha}]})});
  const nc=await gh("/git/commits",{method:"POST",body:JSON.stringify({message:"mod file "+path,tree:tree.sha,parents:[ref.object.sha]})});
  await gh(`/git/refs/heads/${encodeURIComponent(A.branch)}`,{method:"PATCH",body:JSON.stringify({sha:nc.sha})});
  prog(1);toast(T("t_file_ok"));return{path,name:file.name.slice(0,120),size:file.size}}
 catch(e){toast(T("t_file_err")+" ("+(e.status||e.message)+")",1);return null}
 finally{S.uploading=false;if(box)box.hidden=true}}

function rich(text){

  if(id){const t=(url.match(/[?&](?:t|start)=(\d+)/)||[])[1];
   out+=`<span class="yt"><iframe src="https://www.youtube-nocookie.com/embed/${id}?rel=0${t?"&start="+(+t):""}" loading="lazy" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="YouTube"></iframe></span>`;

 return out+esc(src.slice(last))}

const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
let revIO=null;
function motion(){
 app.classList.remove("enter");void app.offsetWidth;app.classList.add("enter");
 if(RM||!("IntersectionObserver" in window))return;
 revIO=revIO||new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){const el=e.target;el.classList.add("in");revIO.unobserve(el);setTimeout(()=>{el.classList.remove("rv","in");el.style.transitionDelay=""},1300)}},{rootMargin:"0px 0px -8% 0px"});
 app.querySelectorAll(".card,.cat,.ni,.ch,.sec-h,.side,.desc,.thx-strip a,.contact>div,.empty,.alist>div").forEach(el=>{if(el.classList.contains("rv"))return;
  const sib=el.parentElement?[...el.parentElement.children].indexOf(el):0;el.style.transitionDelay=Math.min(sib,6)*70+"ms";el.classList.add("rv");revIO.observe(el)});
 app.querySelectorAll(".stats b:not([data-dltotal])").forEach(el=>{const n=+el.textContent;if(!(n>1))return;const t0=performance.now();
  const step=t=>{const k=Math.min(1,(t-t0)/900);el.textContent=Math.round(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}

 for(let i=0;i<14;i++){const d=document.createElement("i");d.className="like-burst";const ang=Math.PI*2*i/14,dist=40+Math.random()*40;d.style.cssText=`left:${cx}px;top:${cy}px;background:${cols[i%3]};--x:${Math.cos(ang)*dist}px;--y:${Math.sin(ang)*dist}px`;document.body.appendChild(d);setTimeout(()=>d.remove(),750)}});

function formVals(){return{pub:$("#mPub").value,title:$("#mTitle").value,cat:$("#mCat").value,creator:$("#mCreator").value,size:$("#mSize").value,version:$("#mVer").value,link:$("#mLink").value,desc:$("#mDesc").value}}
function gal(d){const s=$("#sl");if(!s)return;const n=s.children.length,i=Math.max(0,Math.min(n-1,Math.round(Math.abs(s.scrollLeft)/s.clientWidth)+d));s.children[i].scrollIntoView({behavior:"smooth",block:"nearest",inline:"start"});document.querySelectorAll(".thumbs button").forEach((x,j)=>x.classList.toggle("on",j===i))}
addEventListener("keydown",e=>{if(!$("#sl")||e.target.closest("input,textarea,select"))return;const rtl=L[lang].dir==="rtl";if(e.key==="ArrowLeft")gal(rtl?1:-1);if(e.key==="ArrowRight")gal(rtl?-1:1)});

/* ===== events ===== */
const curCat=()=>CATS.some(c=>c.k===lastH)?lastH:null;
app.addEventListener("input",e=>{if(e.target.id==="q")fillList(curCat())});
app.addEventListener("change",async e=>{
 if(e.target.id==="sort"||e.target.id==="pubF")fillList(curCat());
 if(e.target.id==="mImgs"){const files=[...e.target.files];e.target.value="";for(const f of files){const p=await uploadImg(f);if(p){S.draftImgs.push(p);drawPv()}}}
 if(e.target.id==="tImg"){const f=e.target.files[0];e.target.value="";if(f){const p=await uploadImg(f);if(p){S.thxImg=p;drawPv()}}}
 if(e.target.id==="bgImgs"){const files=[...e.target.files];e.target.value="";S.bgDraft=S.bgDraft??[...D.bgs];for(const f of files){const p=await uploadImg(f);if(p){S.bgDraft.push(p);drawPv()}}}
 if(e.target.id==="nImgs"){const files=[...e.target.files];e.target.value="";for(const f of files){const p=await uploadImg(f);if(p){S.newsImgs.push(p);drawPv()}}}
 if(e.target.id==="mFile"){const f=e.target.files[0];e.target.value="";if(!f||S.uploading)return;
  const r=await uploadModFile(f);if(r){const old=S.draftFile;S.draftFile=r;const sz=$("#mSize");if(sz&&!sz.value)sz.value=fmtSize(r.size);drawPv();if(old&&old!==S.edit?.file)dropFile(old)}}
});
app.addEventListener("click",e=>{const a=e.target.closest("a[data-hit]");if(a)hitDl(a.dataset.hit);
 const y=e.target.closest("a[data-yt]");if(y&&/^[\w-]{11}$/.test(y.dataset.yt)){e.preventDefault();$("#vBox").innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${y.dataset.yt}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="YouTube"></iframe>`;$("#vmodal").classList.add("on")}});
const closeV=()=>{$("#vmodal").classList.remove("on");$("#vBox").innerHTML=""};
$("#vmodal").addEventListener("click",e=>{if(e.target.id==="vmodal"||e.target.id==="vClose")closeV()});
addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#vmodal").classList.contains("on"))closeV()});
app.addEventListener("click",async e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.id==="tRm"){S.thxImg="";drawPv()}
 if(b.id==="tCancel"){S.editThx=null;S.thxImg="";render()}
 if(b.dataset.et){const t=D.thanks.find(x=>x.id===b.dataset.et);if(t){S.editThx={...t};S.thxImg=t.img||"";render();setTimeout(()=>$("#thxH")?.scrollIntoView({block:"start"}),50)}}
 if(b.dataset.xt&&await ask(T("c_del"),T("c_del_b"))){const t=D.thanks.find(x=>x.id===b.dataset.xt);if(await commit(()=>{D.thanks=D.thanks.filter(x=>x.id!==b.dataset.xt)},"delete thanks")&&okImg(t?.img))delFile(t.img)}
 if(b.dataset.brm){S.bgDraft=S.bgDraft??[...D.bgs];S.bgDraft.splice(+b.dataset.brm,1);drawPv()}
 if(b.dataset.nrm){S.newsImgs.splice(+b.dataset.nrm,1);drawPv()}
 if(b.id==="nCancel"){S.editNews=null;S.newsImgs=[];render()}
 if(b.dataset.en){const n=D.news.find(x=>x.id===b.dataset.en);if(n){S.editNews={...n};S.newsImgs=[...(n.imgs||[])];if(location.hash!=="#admin"){history.replaceState(null,"","#admin");lastH=""}render();setTimeout(()=>$("#newsH")?.scrollIntoView({block:"start"}),50)}}
 if(b.dataset.g)gal(+b.dataset.g*(L[lang].dir==="rtl"?1:1));
 if(b.dataset.t)gal(+b.dataset.t-Math.round(Math.abs($("#sl").scrollLeft)/$("#sl").clientWidth));
 if(b.id==="seoB"){await commit(()=>{},"SEO pages + sitemap");}
 if(b.id==="cpLink"){try{await navigator.clipboard.writeText(location.href);toast(T("t_link"))}catch{toast(location.href)}}
 if(b.id==="cpMail"){try{await navigator.clipboard.writeText(MAIL);toast(T("t_copied"))}catch{toast(MAIL)}}
 if(b.id==="logout"){A.token="";A.ok=false;store.set("gmdz_admin",null);toast(T("t_logout"));await loadPublic();render()}
 if(b.dataset.rm){S.draftImgs.splice(+b.dataset.rm,1);drawPv()}
 if(b.id==="rmFile"){S.draftFile=null;drawPv()}
 if(b.dataset.em){const m=D.mods.find(x=>x.id===b.dataset.em);if(m){S.edit={...m};S.draftImgs=[...(m.imgs||[])];S.draftFile=m.file||null;if(location.hash!=="#admin"){history.replaceState(null,"","#admin");lastH=""}render()}}
 if(b.id==="mCancel"){S.edit=null;S.draftImgs=[];S.draftFile=null;render()}
 if(b.dataset.xm&&await ask(T("c_del_mod"),T("c_del_mod_b"))){const m=D.mods.find(x=>x.id===b.dataset.xm);
  if(await commit(()=>{D.mods=D.mods.filter(x=>x.id!==b.dataset.xm)},"delete mod: "+(m?.title||""))){for(const p of (m?.imgs||[]))if(okImg(p))await delFile(p);if(m?.file)await dropFile(m.file);if(lastH.startsWith("mod-"))location.hash="#mods"}}
 if(b.dataset.xn&&await ask(T("c_del"),T("c_del_b"))){const n=D.news.find(x=>x.id===b.dataset.xn);if(await commit(()=>{D.news=D.news.filter(x=>x.id!==b.dataset.xn)},"delete news")){for(const p of (n?.imgs||[]))if(okImg(p))await delFile(p);if(lastH.startsWith("news-"))location.hash="#news"}}
 if(b.dataset.xv&&await ask(T("c_del"),T("c_del_b"))){const v=D.videos.find(x=>x.id===b.dataset.xv);if(await commit(()=>{D.videos=D.videos.filter(x=>x.id!==b.dataset.xv)},"delete video")&&okImg(v?.thumb))await delFile(v.thumb)}
});
async function commit(change,msg){
 if(S.busy)return false;S.busy=true;const backup=JSON.stringify(D);
 try{change();await saveData(msg);toast(T("t_saved"));S.busy=false;render();loadCounts();return true}
 catch(e){if(e.message!==T("t_conflict"))Object.assign(D,JSON.parse(backup));toast(e.status===403?T("t_forbidden"):(e.message||T("t_err")),1,e.status===403);S.busy=false;render();return false}}
app.addEventListener("submit",async e=>{e.preventDefault();const f=e.target,btn=f.querySelector("button.pri");btn.disabled=true;
 try{
  if(f.id==="fLogin"){Object.assign(A,{owner:$("#aOwner").value.trim(),repo:$("#aRepo").value.trim(),branch:$("#aBranch").value.trim()||"main",token:$("#aToken").value.trim()});
   try{await adminLogin();store.set("gmdz_admin",JSON.stringify({owner:A.owner,repo:A.repo,branch:A.branch,token:A.token}));toast(T("t_welcome"));render()}
   catch(err){A.token="";toast(err.status===401?T("t_bad_token"):err.status===404?T("t_no_repo"):err.message,1)}}
  if(f.id==="fMod"){
   if(S.uploading)throw new Error(T("t_wait_up"));
   const link=$("#mLink").value.trim();if(link&&!safeUrl(link))throw new Error(T("t_https"));
   if(!link&&!S.draftFile)throw new Error(T("t_need_dl"));
   const id=S.edit?.id||("m"+uid()),isEdit=!!S.edit?.id,oldFile=S.edit?.file;
   const mod={id,pub:$("#mPub").value,title:$("#mTitle").value.trim(),cat:$("#mCat").value,creator:$("#mCreator").value.trim(),size:$("#mSize").value.trim(),version:$("#mVer").value.trim(),link,file:S.draftFile||null,desc:$("#mDesc").value,imgs:[...S.draftImgs],t:S.edit?.t||Date.now()};
   store.set("gmdz_pub",mod.pub);
   if(await commit(()=>{D.mods=isEdit?D.mods.map(x=>x.id===id?mod:x):[...D.mods,mod]},(isEdit?"edit mod: ":"new mod: ")+mod.title)){
    if(oldFile&&(!mod.file||fileHref(mod.file)!==fileHref(oldFile)))dropFile(oldFile);
    S.edit=null;S.draftImgs=[];S.draftFile=null;location.hash="#mod-"+id}}
  if(f.id==="fThx"){const url=$("#tUrl").value.trim();if(url&&!safeUrl(url))throw new Error(T("t_https"));
   const ed=S.editThx,t={id:ed?.id||("t"+uid()),name:$("#tName").value.trim(),url,desc:$("#tDesc").value.trim(),img:S.thxImg||"",t:ed?.t||Date.now()};
   if(await commit(()=>{D.thanks=ed?D.thanks.map(x=>x.id===t.id?t:x):[...D.thanks,t]},(ed?"edit thanks: ":"thanks: ")+t.name)){if(ed?.img&&ed.img!==t.img&&okImg(ed.img))delFile(ed.img);S.editThx=null;S.thxImg="";render()}}
  if(f.id==="fBg"){const nb=[...(S.bgDraft??D.bgs)],removed=D.bgs.filter(p=>!nb.includes(p));if(await commit(()=>{D.bgs=nb},"background")){for(const p of removed)if(okImg(p))delFile(p);S.bgDraft=null;drawBg()}}
  if(f.id==="fNews"){const ed=S.editNews,n={id:ed?.id||("n"+uid()),pub:$("#nPub").value,title:$("#nTitle").value.trim(),body:$("#nBody").value,imgs:[...S.newsImgs],t:ed?.t||Date.now()};
   const removed=(ed?.imgs||[]).filter(p=>!n.imgs.includes(p));
   if(await commit(()=>{D.news=ed?D.news.map(x=>x.id===n.id?n:x):[...D.news,n]},(ed?"edit news: ":"news: ")+n.title)){for(const p of removed)if(okImg(p))delFile(p);S.editNews=null;S.newsImgs=[];location.hash="#news-"+n.id}}
  if(f.id==="fVid"){const url=$("#vUrl").value.trim();if(!safeUrl(url))throw new Error(T("t_https"));
   const file=$("#vThumb").files[0],thumb=file?await uploadImg(file):"";const v={id:"v"+uid(),title:$("#vTitle").value.trim(),url,thumb,t:Date.now()};await commit(()=>{D.videos=[...D.videos,v]},"video: "+v.title)}
 }catch(err){toast(err.message||T("t_err"),1)}
 const nb=app.querySelector("form#"+f.id+" button.pri");if(nb)nb.disabled=false;
});
addEventListener("beforeunload",e=>{if(S.uploading){e.preventDefault();e.returnValue=""}});

/* ===== boot ===== */
applyLang();drawSnd();render();
(async()=>{
 if(A.token){try{await adminLogin()}catch{A.ok=false;await loadPublic()}}else await loadPublic();
 render();loadCounts();trackVisit();
})();
}
</script>
</body>
</html>
